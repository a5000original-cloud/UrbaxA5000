<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.35" stop-color="#ffb340"/>
      <stop offset="0.75" stop-color="#ff9500"/>
      <stop offset="1" stop-color="#d97a00"/>
    </linearGradient>
    <radialGradient id="pinHighlight" cx="0.35" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="innerCircle" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#2a2a2c"/>
      <stop offset="0.6" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="letterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9500" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle-фон -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Мягкое свечение за пином -->
  <ellipse cx="256" cy="280" rx="200" ry="200" fill="url(#glow)"/>

  <!-- Тень под пином -->
  <ellipse cx="256" cy="440" rx="90" ry="16" fill="#000" opacity="0.55"/>

  <!-- Пин — тень контуром -->
  <path d="M256 82 C176 82 116 142 116 222 C116 306 200 390 256 442 C312 390 396 306 396 222 C396 142 336 82 256 82 Z" fill="#000" opacity="0.4"/>

  <!-- Пин — основной -->
  <path d="M256 76 C176 76 116 136 116 216 C116 300 200 384 256 436 C312 384 396 300 396 216 C396 136 336 76 256 76 Z"
        fill="url(#pinGrad)"
        stroke="#ffffff"
        stroke-width="12"
        stroke-linejoin="round"/>

  <!-- Блик сверху пина -->
  <ellipse cx="220" cy="140" rx="70" ry="35" fill="url(#pinHighlight)"/>

  <!-- Внутренний круг -->
  <circle cx="256" cy="206" r="72" fill="url(#innerCircle)"/>
  <circle cx="256" cy="206" r="72" fill="none" stroke="#ffd27a" stroke-opacity="0.4" stroke-width="2"/>
  <ellipse cx="256" cy="180" rx="40" ry="12" fill="#ffffff" opacity="0.06"/>

  <!-- Буква A -->
  <text x="256" y="234" text-anchor="middle"
        font-family="Inter, SF Pro Display, -apple-system, Arial, sans-serif"
        font-size="82" font-weight="900"
        fill="url(#letterGrad)" letter-spacing="-3">A</text>
</svg>
