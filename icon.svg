<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="0%" r="120%">
      <stop offset="0" stop-color="#2d2d3a"/>
      <stop offset="0.5" stop-color="#0f0f15"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pinBody" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffdc7a"/>
      <stop offset="0.25" stop-color="#ffb340"/>
      <stop offset="0.6" stop-color="#ff9500"/>
      <stop offset="0.85" stop-color="#e87d00"/>
      <stop offset="1" stop-color="#b35400"/>
    </linearGradient>

    <radialGradient id="pinSpec" cx="35%" cy="25%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="innerBg" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#1a1a22"/>
      <stop offset="0.6" stop-color="#050508"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="letterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdc7a"/>
      <stop offset="0.5" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#e07d00"/>
    </linearGradient>

    <radialGradient id="letterGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#ff9500" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff9500" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambient" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ff9500" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#ff9500" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ff9500" stop-opacity="0"/>
    </radialGradient>

    <filter id="pinShadow" x="-40%" y="-20%" width="180%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="20"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="innerBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="iconClip">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" fill="url(#bgGrad)"/>
    <rect x="12" y="12" width="488" height="488" rx="102" fill="none" stroke="url(#glassTop)" stroke-width="1.5"/>
    <ellipse cx="256" cy="240" rx="240" ry="220" fill="url(#ambient)"/>

    <g filter="url(#pinShadow)">
      <path d="M256 52
               C162 52 86 128 86 222
               C86 268 104 312 136 348
               C180 396 236 434 256 448
               C276 434 332 396 376 348
               C408 312 426 268 426 222
               C426 128 350 52 256 52 Z"
            fill="url(#pinBody)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    </g>

    <path d="M256 66
             C168 66 100 134 100 222
             C100 232 101 242 103 252
             C112 172 176 108 256 108
             C336 108 400 172 409 252
             C411 242 412 232 412 222
             C412 134 344 66 256 66 Z"
          fill="url(#pinSpec)" opacity="0.55"/>

    <path d="M110 200
             C116 148 156 108 200 96
             C158 118 128 158 120 210
             C116 240 122 270 138 298
             C122 268 108 236 110 200 Z"
          fill="#ffffff" opacity="0.35" filter="url(#innerBlur)"/>

    <circle cx="256" cy="210" r="62" fill="url(#innerBg)"/>
    <circle cx="256" cy="210" r="62" fill="none" stroke="#ffc84a" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="256" cy="210" r="61" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="256" cy="210" r="48" fill="url(#letterGlow)"/>
    <ellipse cx="256" cy="178" rx="40" ry="12" fill="#ffffff" opacity="0.12"/>

    <text x="256" y="234"
          text-anchor="middle"
          font-family="'Inter', -apple-system, 'SF Pro Display', system-ui, sans-serif"
          font-size="76"
          font-weight="900"
          fill="url(#letterGrad)"
          letter-spacing="-4">A</text>

    <text x="256" y="233"
          text-anchor="middle"
          font-family="'Inter', -apple-system, 'SF Pro Display', system-ui, sans-serif"
          font-size="76"
          font-weight="900"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.25"
          stroke-width="0.8"
          letter-spacing="-4">A</text>

    <line x1="180" y1="416" x2="332" y2="416" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

    <text x="256" y="466"
          text-anchor="middle"
          font-family="'Inter', -apple-system, 'SF Pro Display', system-ui, sans-serif"
          font-size="28"
          font-weight="800"
          fill="#ffffff"
          fill-opacity="0.35"
          letter-spacing="12">A5000</text>

    <ellipse cx="256" cy="30" rx="200" ry="40" fill="#ffffff" opacity="0.05"/>
  </g>

  <rect x="1" y="1" width="510" height="510" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
