<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f26"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc84a"/>
      <stop offset="0.5" stop-color="#ff9500"/>
      <stop offset="1" stop-color="#e07800"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#ff9500" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff9500" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="230" r="200" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <path d="M256 62 C170 62 100 132 100 218 C100 314 210 400 256 442 C302 400 412 314 412 218 C412 132 342 62 256 62 Z"
          fill="url(#pinGrad)" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <path d="M256 78 C185 78 128 135 128 206 C128 216 129 226 131 236 C136 178 188 130 256 130 C324 130 376 178 381 236 C383 226 384 216 384 206 C384 135 327 78 256 78 Z"
        fill="url(#shine)" opacity="0.7"/>

  <circle cx="256" cy="212" r="58" fill="#000" opacity="0.92"/>
  <circle cx="256" cy="212" r="58" fill="none" stroke="rgba(255,200,74,0.4)" stroke-width="2"/>
  <text x="256" y="232" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif"
        font-size="66" font-weight="900" fill="#ffb340" letter-spacing="-3">A</text>

  <text x="256" y="478" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif"
        font-size="22" font-weight="800" fill="#5a5a60" letter-spacing="8">A5000</text>
</svg>
